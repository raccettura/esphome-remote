# ESPHome IR remote for a Sharp Aquos LC-70EQ10U.
# The device runs its own Wi-Fi access point; join it from a phone or computer
# and open http://192.168.4.1 for the remote control page. See README.md.

substitutions:
  device_name: sharp-tv-remote
  friendly_name: Sharp TV Remote
  ap_ssid: Sharp TV Remote
  # GPIO driving the IR LED (through a transistor - see README).
  ir_pin: GPIO10

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - sharp_tv_codes.h

esp32:
  board: lolin_c3_mini
  framework:
    sdkconfig_options:
      # The default pool of 10 sockets (shared by the web server, OTA and DHCP)
      # runs out when a browser opens several connections at once, and the page
      # then fails to load with "httpd_accept_conn: error in accept (23)".
      CONFIG_LWIP_MAX_SOCKETS: "16"

logger:

# Access-point-only Wi-Fi: no home network needed.
wifi:
  ap:
    ssid: ${ap_ssid}
    password: !secret ap_password
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0
  # The Lolin C3 Mini's antenna design is unreliable at full transmit power.
  output_power: 8.5dB

ota:
  - platform: esphome
    password: !secret ota_password

# Serve our own remote page (web/remote.js + web/remote.css) instead of the
# default ESPHome UI, which loads its script from the internet.
web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: web/remote.js
  css_include: web/remote.css
  # Don't stream logs to browsers; use USB (esphome logs) instead.
  log: false

remote_transmitter:
  id: ir_tx
  pin: ${ir_pin}
  carrier_duty_percent: 50%
  non_blocking: true

select:
  - platform: template
    id: code_set
    name: Code Set
    # Order must match CODE_SETS in sharp_tv_codes.h.
    options:
      - "Sharp Aquos 2011-2016 (LC-70EQ10U)"
      - "Sharp 2017+ Hisense-built (NEC)"
      - "Sharp alternate NEC (basic keys only)"
    initial_option: "Sharp Aquos 2011-2016 (LC-70EQ10U)"
    optimistic: true
    restore_value: true

text_sensor:
  - platform: template
    id: last_sent
    name: Last Sent

# Code tester: send any Sharp-protocol address/command, to find codes that
# aren't in the tables.
number:
  - platform: template
    id: test_address
    name: Test Address
    min_value: 0
    max_value: 31
    step: 1
    initial_value: 1
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: test_command
    name: Test Command
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box

button:
  - platform: template
    name: Send Test Code
    on_press:
      - lambda: |-
          auto address = (uint8_t) id(test_address).state;
          auto command = (uint8_t) id(test_command).state;
          sharp_tv::transmit_sharp(id(ir_tx), address, command);
          id(last_sent).publish_state("Test (Sharp " + std::to_string(address) + "/" +
                                      std::to_string(command) + ")");

  # Remote buttons. The names are what the web page presses.
  # Top
  - !include { file: common/tv_key.yaml, vars: { name: "Power", key: POWER } }
  - !include { file: common/tv_key.yaml, vars: { name: "Power On", key: POWER_ON } }
  - !include { file: common/tv_key.yaml, vars: { name: "Power Off", key: POWER_OFF } }
